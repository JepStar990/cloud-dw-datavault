name: deploy-dashboard

on:
  push:
    branches: [main]
    paths:
      - "reports/dw_dashboard.html"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Prepare artifact
        run: |
          mkdir -p _site
          cp reports/index.html _site/index.html
          cp reports/dw_dashboard.html _site/dw_dashboard.html
          cp reports/dbt_docs.html _site/dbt_docs.html 2>/dev/null || echo "dbt_docs.html not found, skipping"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
